# Ascension: the public site and the game server on ascension-euw-1.duckdns.org.
# Install as /etc/nginx/sites-available/ascension.conf (see site/README.md).
#
# The game server (`rom serve`, systemd user service ascension.service) listens on
# 127.0.0.1:7400 and answers only two paths under its base path "/": GET /status (JSON) and the
# WebSocket /ws that every game client connects to. Those two stay proxied exactly as before;
# every other path goes to the public site's server (site/serve.py, the user service
# ascension-site.service on 127.0.0.1:18090), which serves ~/ascension-site/current (a symlink
# that site/deploy.sh switches atomically).

server {
    listen 80;
    listen [::]:80;
    server_name ascension-euw-1.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ascension-euw-1.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ascension-euw-1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascension-euw-1.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ASCENSION:10m;
    ssl_session_timeout 10m;

    # ---- the game server: the WebSocket and the status page, as before
    location = /ws {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /status {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- the public site: site/serve.py, the user service ascension-site.service in the
    # server user's home (like the other web services there), on 127.0.0.1:18090. It sets its
    # own cache and security headers; nginx compresses its text.
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;   # text/html always

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
