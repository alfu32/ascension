# Ascension: the public site and the game server on ascension-euw-1.duckdns.org.
# Install as /etc/nginx/sites-available/ascension.conf (see site/README.md).
#
# The game server (`rom serve`, systemd user service ascension.service) listens on
# 127.0.0.1:7400 and answers only two paths under its base path "/": GET /status (JSON) and the
# WebSocket /ws that every game client connects to. Those two stay proxied exactly as before;
# every other path is the static site in /var/www/ascension-site/current (a symlink that
# site/deploy.sh switches atomically).

server {
    listen 80;
    listen [::]:80;
    server_name ascension-euw-1.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ascension-euw-1.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ascension-euw-1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascension-euw-1.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ASCENSION:10m;
    ssl_session_timeout 10m;

    # ---- the game server: the WebSocket and the status page, as before
    location = /ws {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /status {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- the public site
    root /var/www/ascension-site/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;   # text/html always

    # Every location below sets its own headers (add_header does not inherit once a location
    # has one). The pages' security policy: everything comes from this site, nothing from
    # anywhere else.

    # Pages: always revalidated (ETag), so a new deploy shows at once.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Pictures, sounds, music, styles and scripts carry a content hash in their name:
    # a changed file gets a new name, so they may be kept for a year.
    location ~ ^/(img|music|sounds|static)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
