[workspace]
members = [
    "crates/rom-rules",
    "crates/rom-sim",
    "crates/rom-mapgen",
    "crates/rom-geo",
    "crates/rom-ai",
    "crates/rom-save",
    "crates/rom-match",
    "crates/rom-net",
    "crates/rom-kit",
    "crates/rom-models",
    "crates/rom-render",
    "crates/rom-app",
    "crates/rom-cli",
    "crates/rom-audio",
]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.158.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Ascension-All-Rights-Reserved"  # see ../LICENSE (owner, 2026-11-28)

[workspace.dependencies]
rom-rules = { path = "crates/rom-rules" }
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
thiserror = "2"
rom-render = { path = "crates/rom-render" }
rom-kit = { path = "crates/rom-kit" }
rom-models = { path = "crates/rom-models" }
rom-geo = { path = "crates/rom-geo" }
rom-match = { path = "crates/rom-match" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }
gpui-component = { version = "=0.5.1", default-features = false }
raylib = "=6.0.0"
resvg = { version = "=0.47.0", default-features = false }
fontdue = "=0.9.5"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# Audio output (ALSA, WASAPI, CoreAudio) and the Ogg Vorbis decoder, for rom-audio.
cpal = { version = "=0.18.2", default-features = false }
lewton = { version = "=0.10.2", default-features = false, features = ["ogg"] }

[patch.crates-io]
# gpui-component 0.5.1 with highlighter and input-refresh fixes; see vendor/gpui-component/PATCHES.md.
gpui-component = { path = "vendor/gpui-component" }
# GPUI 0.2.2 resolves xattr 0.2.3, whose Linux branch uses ENOATTR; the copy maps it to ENODATA.
xattr = { path = "vendor/xattr" }

# The late-game save test runs the whole content audit; the simulation crates are
# optimised in dev and test builds so it finishes in a minute or two.
[profile.dev.package.rom-sim]
opt-level = 3
[profile.dev.package.rom-geo]
opt-level = 3
[profile.dev.package.rom-rules]
opt-level = 3
[profile.dev.package.rom-mapgen]
opt-level = 3
# Decoding every embedded sound at start-up (and in rom-audio's tests) needs an optimised decoder.
[profile.dev.package.lewton]
opt-level = 3
[profile.dev.package.ogg]
opt-level = 3
